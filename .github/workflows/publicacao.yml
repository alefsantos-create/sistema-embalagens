name: Agendar publicação
on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Data de publicação em Brasília (AAAA-MM-DD)'
        required: true
        type: string
      horario:
        description: 'Horário de Brasília (HH:MM, formato 24 horas)'
        required: true
        type: string
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publicacao-agendada-pages
  cancel-in-progress: false
jobs:
  agenda:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.agenda.outputs.publicar }}
      versao: ${{ steps.agenda.outputs.versao }}
    steps:
      - uses: actions/checkout@v6
      - id: agenda
        env:
          GH_TOKEN: ${{ github.token }}
          DATA: ${{ inputs.data }}
          HORARIO: ${{ inputs.horario }}
          EVENTO: ${{ github.event_name }}
          VERSAO: ${{ github.sha }}
        run: python .github/publicacao.py verificar
  publicar:
    needs: agenda
    if: needs.agenda.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.agenda.outputs.versao }}
      - uses: actions/configure-pages@v5
      - name: Preparar somente arquivos do site
        run: |
          mkdir /tmp/site-pages
          cp index.html 404.html /tmp/site-pages/
          touch /tmp/site-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/site-pages
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
      - name: Confirmar publicação
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO_PUBLICADA: ${{ needs.agenda.outputs.versao }}
        run: python .github/publicacao.py concluir
